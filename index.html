<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mastery IDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-surface: #FEF7FF;
            --md-sys-color-surface-variant: #E7E0EC;
            --md-sys-color-on-surface: #1D1B20;
            --md-sys-color-outline: #79747E;
            --md-sys-color-secondary-container: #E8DEF8;
            --md-sys-color-on-secondary-container: #1D192B;
            --radius-lg: 28px;
            --radius-md: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(254, 247, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: 0 24px 48px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(103, 80, 164, 0.1);
        }

        .auth-card h2 { margin: 0 0 12px; color: var(--md-sys-color-primary); font-weight: 700; }
        .auth-card p { font-size: 0.9rem; color: var(--md-sys-color-outline); margin-bottom: 24px; }

        .auth-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--md-sys-color-outline);
            font-size: 0.9rem;
            outline: none;
            margin-bottom: 24px;
            transition: var(--transition);
            text-align: center;
        }

        .auth-input:focus { border-color: var(--md-sys-color-primary); box-shadow: 0 0 0 3px rgba(103, 80, 164, 0.15); }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--md-sys-color-primary);
            color: white;
            border: none;
            border-radius: 100px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
        }

        .auth-btn:hover { filter: brightness(1.1); transform: scale(1.02); }

        nav {
            width: 300px;
            background-color: var(--md-sys-color-surface-variant);
            border-right: 1px solid var(--md-sys-color-outline);
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
            overflow-y: hidden;
        }

        .nav-content-wrapper { flex: 1; overflow-y: auto; padding-right: 4px; }
        .nav-content-wrapper::-webkit-scrollbar { width: 6px; }
        .nav-content-wrapper::-webkit-scrollbar-track { background: transparent; }
        .nav-content-wrapper::-webkit-scrollbar-thumb { background: var(--md-sys-color-outline); border-radius: 10px; }

        .nav-header {
            font-size: 1.2rem;
            font-weight: 700;
            padding: 0 16px 24px;
            color: var(--md-sys-color-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-group { margin-bottom: 8px; overflow: hidden; transition: max-height 0.3s ease-out; }
        .nav-group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            cursor: pointer;
            border-radius: var(--radius-md);
            transition: var(--transition);
            color: var(--md-sys-color-on-surface);
            font-weight: 500;
            font-size: 0.9rem;
        }
        .nav-group-header:hover { background-color: rgba(103, 80, 164, 0.08); }
        .nav-group-header .arrow { transition: transform 0.3s ease; font-size: 18px; }
        .nav-group.collapsed .nav-group-header .arrow { transform: rotate(-90deg); }

        .nav-group-content { display: flex; flex-direction: column; padding-left: 24px; margin-top: 4px; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            text-decoration: none;
            color: var(--md-sys-color-on-surface);
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 2px;
        }
        .nav-item:hover { background-color: rgba(103, 80, 164, 0.08); transform: translateX(4px); }
        .nav-item.active { background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); font-weight: 500; }

        main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: 100vh; }
        .md-viewer { padding: 40px; overflow-y: auto; border-right: 1px solid var(--md-sys-color-outline); line-height: 1.6; }
        .md-viewer h1 { color: var(--md-sys-color-primary); border-bottom: 2px solid var(--md-sys-color-surface-variant); padding-bottom: 10px; }
        .md-viewer code { font-family: 'JetBrains Mono', monospace; background: var(--md-sys-color-surface-variant); padding: 2px 6px; border-radius: 4px; }
        .md-viewer pre { background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: var(--radius-md); overflow-x: auto; }

        .playground { display: flex; flex-direction: column; background-color: #fefefe; height: 100vh; }
        .editor-container { flex: 1; display: grid; grid-template-rows: repeat(3, 1fr); gap: 8px; padding: 16px; background-color: var(--md-sys-color-surface-variant); }
        .editor-box { display: flex; flex-direction: column; background: white; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--md-sys-color-outline); }
        .editor-header { padding: 6px 12px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; background: var(--md-sys-color-surface-variant); color: var(--md-sys-color-outline); display: flex; justify-content: space-between; align-items: center; }
        textarea { flex: 1; border: none; padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; resize: none; outline: none; color: #333; }
        .preview-container { height: 40%; background: white; border-top: 4px solid var(--md-sys-color-primary); position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
        .run-btn {
            position: absolute; top: 16px; right: 16px; background: var(--md-sys-color-primary); color: white;
            border: none; padding: 8px 20px; border-radius: 100px; font-weight: 500; cursor: pointer;
            box-shadow: 0 4px 8px rgba(103, 80, 164, 0.3); transition: var(--transition);
            display: flex; align-items: center; gap: 8px; z-index: 10;
        }
        .run-btn:hover { transform: scale(1.05); filter: brightness(1.1); }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>歡迎回來</h2>
            <p>請輸入您的 GitHub PAT Token 以進入工業級 IDE</p>
            <input type="password" id="github-token" class="auth-input" placeholder="ghp_xxxxxxxxxxxx">
            <button class="auth-btn" onclick="submitToken()">進入學習空間</button>
        </div>
    </div>

    <nav id="sidebar">
        <div class="nav-header">
            <span class="material-symbols-outlined">school</span>
            Frontend Mastery
        </div>
        <div class="nav-content-wrapper" id="nav-content"></div>
    </nav>

    <main>
        <div class="md-viewer" id="md-viewer">
            <h1>歡迎來到 IDE</h1>
            <p>請先驗證身份，隨後從左側選擇章節開始學習...</p>
        </div>
        <div class="playground">
            <div class="editor-container">
                <div class="editor-box"><div class="editor-header"><span>HTML</span></div><textarea id="html-editor"></textarea></div>
                <div class="editor-box"><div class="editor-header"><span>CSS</span></div><textarea id="css-editor"></textarea></div>
                <div class="editor-box"><div class="editor-header"><span>JavaScript</span></div><textarea id="js-editor"></textarea></div>
            </div>
            <div class="preview-container">
                <button class="run-btn" onclick="runCode()"><span class="material-symbols-outlined">play_arrow</span> 運行</button>
                <iframe id="preview"></iframe>
            </div>
        </div>
    </main>

    <script>
        const GITHUB_USER = "potatosserver";
        const GITHUB_REPO = "frontend-mastery";
        const BRANCH = "master";
        let currentToken = "";

        function decodeBase64(encodedString) {
            const cleaned = encodedString.replace(/\\n/g, '').replace(/\s+/g, '');
            return decodeURIComponent(escape(window.atob(cleaned)));
        }

        async function submitToken() {
            const token = document.getElementById('github-token').value.trim();
            if (!token) return alert("請輸入 Token！");

            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/curriculum.json?ref=${BRANCH}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`${errorData.message} (Status: ${response.status})`);
                }
                
                currentToken = token;
                const overlay = document.getElementById('auth-overlay');
                overlay.style.opacity = '0';
                overlay.style.visibility = 'hidden';
                initNav();
            } catch (e) {
                alert("驗證失敗：" + e.message);
            }
        }

        async function fetchGitHubFile(path) {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}?ref=${BRANCH}`, {
                headers: { 'Authorization': `token ${currentToken}` }
            });
            if (!response.ok) throw new Error(`Fetch failed: ${response.status}`);
            const dataObj = await response.json();
            return decodeBase64(dataObj.content);
        }

        async function initNav() {
            const navContent = document.getElementById('nav-content');
            try {
                const jsonText = await fetchGitHubFile('curriculum.json');
                const data = JSON.parse(jsonText);
                navContent.innerHTML = '';

                for (const [folder, module] of Object.entries(data)) {
                    const group = document.createElement('div');
                    group.className = 'nav-group';
                    const header = document.createElement('div');
                    header.className = 'nav-group-header';
                    header.innerHTML = `<span>${module.title}</span><span class="material-symbols-outlined arrow">expand_more</span>`;
                    header.onclick = () => group.classList.toggle('collapsed');
                    
                    const content = document.createElement('div');
                    content.className = 'nav-group-content';
                    module.files.forEach(file => {
                        const item = document.createElement('a');
                        item.className = 'nav-item';
                        item.innerHTML = `<span class="material-symbols-outlined" style="font-size:18px">description</span> ${file.name}`;
                        item.onclick = () => loadMarkdown(folder, file.id, item);
                        content.appendChild(item);
                    });
                    group.appendChild(header);
                    group.appendChild(content);
                    navContent.appendChild(group);
                }
            } catch (e) {
                navContent.innerHTML = `<div style="padding:16px; color:red">導航載入失敗: ${e.message}</div>`;
            }
        }

        async function loadMarkdown(folder, file, element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            const viewer = document.getElementById('md-viewer');
            viewer.innerHTML = '正在載入內容...';
            try {
                const text = await fetchGitHubFile(`curriculum/${folder}/${file}`);
                viewer.innerHTML = marked.parse(text);
            } catch (e) {
                viewer.innerHTML = `<h1 style="color:red">載入失敗</h1><p>${e.message}</p>`;
            }
        }

        function runCode() {
            const html = document.getElementById('html-editor').value;
            const css = document.getElementById('css-editor').value;
            const js = document.getElementById('js-editor').value;
            const preview = document.getElementById('preview');
            preview.srcdoc = `<!DOCTYPE html><html><head><style>${css}</style></head><body>${html}<script>${js}<\/script></body></html>`;
        }
    </script>
</body>
</html>
